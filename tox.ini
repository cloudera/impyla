[tox]
requires =
    tox>=4
env_list = py{38,39,310,311,312,313,314}

[testenv]
description = Run unit tests assuming local impala dev environment
deps =
    pytest
    sqlalchemy
    requests
    pandas
setenv =
    IMPYLA_TEST_HIVE_PORT = 11050
    IMPYLA_TEST_HIVE_USER = hive
pass_env =
    IMPYLA_SSL_CERT
    IMPYLA_SSL_WRONG_CERT
    IMPYLA_TEST_AUTH_MECH
commands =
    pytest --junitxml=junit-reports/{env:IMPYLA_REPORT_PREFIX}{envname}/results.xml --connect impala/tests {posargs}
